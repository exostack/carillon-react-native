name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
      - name: Check the tag matches the version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn prepare
      # Trusted publishing is used when configured on npmjs.com; NPM_TOKEN is
      # only needed for the first publish, before the package exists.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
